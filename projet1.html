<!DOCTYPE html>
<html lang="en">
<head>
     <Meta charset="UTF-8">
     <meta name="viewport"content="width=device-width,
initial-scale=1.0">
<title>Resume Builder</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
      <div class="resume-container">
      <h1>Resume Builder</h1>
      <form id="resumeForm">
        <lable for="fullname">Full Name:</lable>
        <input type="text" id="fullName" name="fullName"required>
       <lable for="Address">Address:</lable>
       <textarea id="Address" name="Address"rows="2" required></textarea>
      <lable for="nationality">Nationality:</lable>
        <input type="text" id="nationality" name="nationality"required> 
      <lable for="email">email:</lable>
      <input type="email" id ="email" name="email"required>
      <lable for="phone">Phone:</lable>
      <input type="tel" id ="phone" name="phone"required>
        <lable for="Gender">Gender:</lable>
        <input type="text" id="Gender" name="Gender"required>
      <lable for="summary">Professional Summary:</lable>
       <textarea id="Summary" name="summary"rows="3" required></textarea>
       <lable for="experience">work experience:</lable>
       <textarea id="experience" name="experience"rows="3" required></textarea>
        <lable for="education">Education:</lable>
       <textarea id="education" name="education"rows="3" required></textarea>
       <lable for="skills">skills:</lable>
       <textarea id="skills" name="skills"rows="3" required></textarea>
       <button type="submit">Gererate Resume</button>
</form>
</body>
</html>
